services:
  - type: web
    name: alphatekx
    env: node
    plan: free
    branch: main
    autoDeploy: true
    # npm install MUST be explicit here: Render's cache can restore node_modules
    # without running lifecycle scripts, which silently skipped the Chromium
    # download and left the restoration agent without a browser.
    buildCommand: npm install && npx playwright install chromium && node scripts/build.mjs
    startCommand: node --experimental-strip-types server.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: 0
      - key: PUBLIC_APP_URL
        value: https://alphatekx.name.ng
      - key: VITE_PUBLIC_APP_URL
        value: https://alphatekx.name.ng
      - key: GITHUB_CALLBACK_URL
        value: https://alphatekx.name.ng/api/auth/github/callback
      - key: GOOGLE_REDIRECT_URI
        value: https://alphatekx.name.ng/api/auth/gmail/callback
      - key: META_REDIRECT_URI
        value: https://alphatekx.name.ng/api/connectors/facebook/callback
